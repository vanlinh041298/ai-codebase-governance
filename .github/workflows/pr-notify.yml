name: Notify Core Reviewers

on:
  pull_request:
    types: [opened, ready_for_review]

permissions:
  pull-requests: read

jobs:
  notify-slack:
    if: ${{ github.event.pull_request.draft == false && secrets.SLACK_WEBHOOK_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "New PR ready for core review: ${{ github.event.pull_request.html_url }}"
            }
